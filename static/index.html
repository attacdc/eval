<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HumanEval Code Evaluation PWA">
    <meta name="theme-color" content="#2196F3">
    <title>HumanEval PWA</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/icon-192.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 HumanEval Evaluation</h1>
            <div class="header-actions">
                <button id="installBtn" class="btn btn-secondary" style="display: none;">
                    Install App
                </button>
                <button id="refreshBtn" class="btn btn-primary">Refresh</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="problems">Problems</button>
            <button class="tab" data-tab="results">Results</button>
            <button class="tab" data-tab="evaluate">Evaluate</button>
        </nav>

        <!-- Problems Tab -->
        <div id="problemsTab" class="tab-content active">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search problems...">
            </div>
            <div id="problemsList" class="problems-grid">
                <div class="loading">Loading problems...</div>
            </div>
        </div>

        <!-- Results Tab -->
        <div id="resultsTab" class="tab-content">
            <div id="resultsList" class="results-list">
                <div class="loading">Loading results...</div>
            </div>
        </div>

        <!-- Evaluate Tab -->
        <div id="evaluateTab" class="tab-content">
            <div class="evaluate-form">
                <h2>Evaluate Completions</h2>
                <div class="form-group">
                    <label for="sampleFile">Sample File Path:</label>
                    <input type="text" id="sampleFile" placeholder="data/results-*.jsonl">
                </div>
                <div class="form-group">
                    <label for="kValues">K Values (comma-separated):</label>
                    <input type="text" id="kValues" value="1,10,100" placeholder="1,10,100">
                </div>
                <div class="form-group">
                    <label for="nWorkers">Number of Workers:</label>
                    <input type="number" id="nWorkers" value="4" min="1" max="16">
                </div>
                <div class="form-group">
                    <label for="timeout">Timeout (seconds):</label>
                    <input type="number" id="timeout" value="3.0" step="0.1" min="0.1">
                </div>
                <button id="evaluateBtn" class="btn btn-primary">Run Evaluation</button>
                <div id="evaluationResults" class="evaluation-results"></div>
            </div>
        </div>

        <!-- Problem Detail Modal -->
        <div id="problemModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle"></h2>
                <div id="modalBody"></div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
